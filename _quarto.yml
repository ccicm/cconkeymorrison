project:
  type: website
  output-dir: _site
  pre-render: python3 _scripts/build_includes.py
  resources:
    - data/
  render:
    - "*.qmd"
    - "**/*.qmd"
    - "!posts/_template.qmd"

description: "Connor Conkey-Morrison is a provisional psychologist and PhD candidate researching school attendance problems, emotionally based school avoidance, and the data systems that record attendance."
lang: en-AU

execute:
  engine: markdown

website:
  site-url: https://www.connorconkeymorrison.com
  title: "Connor Conkey-Morrison"
  image: /images/og-default.jpg
  image-alt: "Connor Conkey-Morrison: PhD candidate and provisional psychologist, school attendance research"
  search: false
  favicon: favicon.ico
  navbar:
    left:
      - href: research/index.qmd
        text: School Attendance Research
      - href: research/publications.qmd
        text: Publications
      - href: research/projects.qmd
        text: Projects
      - text: More
        menu:
          - href: research/resources.qmd
            text: Resources
          - href: research/reading-list.qmd
            text: Reading List
          - href: posts/index.qmd
            text: Writing
    right:
      - text: ORCID
        href: https://orcid.org/0009-0000-1020-2333
      - text: Google Scholar
        href: https://scholar.google.com/citations?user=ZEvUL_kAAAAJ&hl=en
      - text: GitHub
        href: https://github.com/ccicm
      - text: LinkedIn
        href: https://www.linkedin.com/in/connorconkeymorrison
      - text: Contact me
        href: contact.qmd

format:
  html:
    open-graph: true
    twitter-card: true
    theme: cosmo
    css: styles.css
    toc: false
    smooth-scroll: true
    canonical-url: true
    include-in-header:
      text: |
        <meta name="author" content="Connor Conkey-Morrison">
        <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "Person",
          "name": "Connor Conkey-Morrison",
          "url": "https://www.connorconkeymorrison.com",
          "jobTitle": "PhD Candidate, Provisional Psychologist, Sessional Academic",
          "description": "Provisional psychologist and PhD candidate researching school attendance problems, emotionally based school avoidance, and the data systems that record attendance.",
          "affiliation": {
            "@type": "CollegeOrUniversity",
            "name": "RMIT University"
          },
          "sameAs": [
            "https://orcid.org/0009-0000-1020-2333",
            "https://scholar.google.com/citations?user=ZEvUL_kAAAAJ&hl=en",
            "https://www.linkedin.com/in/connorconkeymorrison",
            "https://github.com/ccicm",
            "https://digitalminds.au/connor-conkey-morrison/"
          ]
        }
        </script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
        <link rel="icon" type="image/x-icon" href="/favicon.ico">
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    include-after-body:
      - text: |
          <script data-goatcounter="https://conkeymorrison.goatcounter.com/count"
                  async src="//gc.zgo.at/count.js"></script>
          <script>
          document.addEventListener('DOMContentLoaded', function() {
            function count(path, title) {
              if (!window.goatcounter || !window.goatcounter.count) return;
              window.goatcounter.count({ path: path, title: title, event: true });
            }
            document.querySelectorAll('a[href*="doi.org"]').forEach(function(link) {
              link.addEventListener('click', function() { count('/event/doi-click', 'DOI link click'); });
            });
            document.querySelectorAll('a[href*="orcid.org"], a[href*="scholar.google.com"], a[href*="linkedin.com"]').forEach(function(link) {
              link.addEventListener('click', function() { count('/event/profile-click', 'External profile link click'); });
            });
            var contactForm = document.getElementById('contact-form');
            if (contactForm) {
              contactForm.addEventListener('submit', function() {
                count('/event/contact-submit', 'Contact form submission');
              });
            }
          });
          </script>
          <script>
          (function() {
            function markExternalLinks(root) {
              root.querySelectorAll('a[href]').forEach(function(link) {
                var url;
                try { url = new URL(link.href, window.location.href); } catch (_) { return; }
                var sameSite = url.hostname === window.location.hostname ||
                  url.hostname === 'connorconkeymorrison.com' ||
                  url.hostname === 'www.connorconkeymorrison.com';
                if (sameSite || !/^https?:$/.test(url.protocol)) {
                  if (link.target === '_blank') link.removeAttribute('target');
                  if (link.rel) {
                    var rel = link.rel.split(/\s+/).filter(function(value) {
                      return value !== 'noopener' && value !== 'noreferrer';
                    }).join(' ');
                    if (rel) link.rel = rel;
                    else link.removeAttribute('rel');
                  }
                  var marker = link.querySelector('.external-link-icon');
                  if (marker) marker.remove();
                  return;
                }
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
                if (!link.querySelector('img') && !link.querySelector('.external-link-icon') && link.textContent.trim()) {
                  var hasArrow = /[↗→]\s*$/.test(link.textContent.trim());
                  var marker = document.createElement('span');
                  marker.className = 'external-link-icon';
                  marker.innerHTML = (hasArrow ? '' : '<span aria-hidden="true"> ↗</span>') + '<span class="sr-only"> (opens in a new tab)</span>';
                  link.appendChild(marker);
                }
              });
            }
            markExternalLinks(document);
          })();
          </script>
          <div class="site-accessibility">This site aims to meet WCAG 2.2 AA. <a href="/contact.html?type=bug">Report an accessibility or website problem.</a></div>
      - file: _includes/last-updated.html
