project:
  type: website
  output-dir: _site
  resources:
    - data/

site-url: https://connorconkeymorrison.com
description: "Connor Conkey-Morrison is a provisional psychologist and PhD candidate working across school attendance problems, emotionally based school avoidance, psychology, behavioural addiction, digital health, measurement, and education systems."
lang: en-AU

execute:
  engine: markdown

website:
  title: "Connor Conkey-Morrison"
  search: false
  favicon: favicon.ico
  navbar:
    left:
      - href: research/index.qmd
        text: School Attendance Research
      - href: research/publications.qmd
        text: Publications
      - href: research/projects.qmd
        text: Projects
      - text: More
        menu:
          - href: teaching.qmd
            text: Teaching
          - href: research/resources.qmd
            text: Resources (in development)
          - href: research/reading-list.qmd
            text: Reading List
    right:
      - text: ORCID
        href: https://orcid.org/0009-0000-1020-2333
      - text: Google Scholar
        href: https://scholar.google.com/citations?user=ZEvUL_kAAAAJ&hl=en
      - text: GitHub
        href: https://github.com/ccicm
      - text: LinkedIn
        href: https://www.linkedin.com/in/connorconkeymorrison
      - text: Contact me
        href: contact.qmd

format:
  html:
    open-graph: true
    twitter-card: true
    link-external-newwindow: true
    theme: cosmo
    css: styles.css
    toc: false
    smooth-scroll: true
    include-in-header:
      text: |
        <meta name="author" content="Connor Conkey-Morrison">
        <meta name="keywords" content="Connor Conkey-Morrison, school attendance problems, emotionally based school avoidance, EBSA, school refusal, psychology, behavioural addiction, digital health, measurement, education systems">
        <meta name="robots" content="index, follow">
        <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "Person",
          "name": "Connor Conkey-Morrison",
          "url": "https://connorconkeymorrison.com",
          "jobTitle": "PhD Candidate, Provisional Psychologist, Sessional Academic",
          "description": "Provisional psychologist and researcher working across school attendance problems, emotionally based school avoidance, psychology, behavioural addiction, digital health, measurement, and education systems.",
          "sameAs": [
            "https://orcid.org/0009-0000-1020-2333",
            "https://scholar.google.com/citations?user=ZEvUL_kAAAAJ&hl=en",
            "https://www.linkedin.com/in/connorconkeymorrison",
            "https://github.com/ccicm"
          ]
        }
        </script>
        <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
        <link rel="icon" type="image/x-icon" href="/favicon.ico">
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
        <script>
        document.addEventListener('DOMContentLoaded', function() {
          var s = getComputedStyle(document.documentElement);
          window.CCM_COLORS = {
            navy:      s.getPropertyValue('--navy').trim()       || '#1a2e4a',
            navyLight: s.getPropertyValue('--navy-light').trim() || '#2a4a6a',
            accent:    s.getPropertyValue('--accent').trim()     || '#c8922a',
            bg:        s.getPropertyValue('--bg').trim()         || '#f8f7f5',
            bgCard:    s.getPropertyValue('--bg-card').trim()    || '#ffffff',
            textMuted: s.getPropertyValue('--text-muted').trim() || '#5c5c5c',
            border:    s.getPropertyValue('--border').trim()     || '#e4e1da',
            tagBg:     s.getPropertyValue('--tag-bg').trim()     || '#eef2f8',
            radius:    s.getPropertyValue('--radius').trim()     || '12px',
          };
        });
        </script>
    include-after-body:
      text: |
        <div class="site-last-updated">Last updated <time id="site-last-updated">15 November 2026</time></div>
        <div class="site-accessibility">This site aims to meet WCAG 2.2 AA. <a href="/contact.html?type=bug">Report an accessibility or website problem.</a></div>
        <script>
        (async function() {
          try {
            const response = await fetch('/data/metrics.json');
            if (!response.ok) return;
            const metrics = await response.json();
            if (metrics.updated) document.getElementById('site-last-updated').textContent = new Date(metrics.updated).toLocaleDateString('en-AU', { day: 'numeric', month: 'long', year: 'numeric' });
          } catch (_) {}
        })();
        </script>
        <script>
        (function() {
          function markExternalLinks(root) {
            root.querySelectorAll('a[href]').forEach(function(link) {
              var url;
              try { url = new URL(link.href, window.location.href); } catch (_) { return; }
              var sameSite = url.hostname === window.location.hostname ||
                url.hostname === 'connorconkeymorrison.com' ||
                url.hostname === 'www.connorconkeymorrison.com';
              if (sameSite || !/^https?:$/.test(url.protocol)) return;
              link.target = '_blank';
              link.rel = 'noopener noreferrer';
              if (!link.querySelector('img') && !link.querySelector('.external-link-icon') && link.textContent.trim() && !/[↗→]\s*$/.test(link.textContent.trim())) {
                var marker = document.createElement('span');
                marker.className = 'external-link-icon';
                marker.setAttribute('aria-hidden', 'true');
                marker.textContent = ' ↗';
                link.appendChild(marker);
              }
            });
          }
          markExternalLinks(document);
          new MutationObserver(function() { markExternalLinks(document); }).observe(document.body, { childList: true, subtree: true });
        })();
        </script>
