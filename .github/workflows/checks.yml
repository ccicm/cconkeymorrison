name: Pull request checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  links-and-accessibility:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Fetch local data
        run: |
          python -m pip install requests
          python _scripts/fetch_metrics.py

      - name: Render Quarto site
        run: quarto render

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --retry-wait-time 2 --max-retries 3 --accept 200,204,206,429 --exclude-mail '_site/**/*.html'

      - name: Start preview server
        run: |
          npx --yes http-server _site -p 4173 --silent &
          for i in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          exit 1

      - name: Check accessibility
        run: npx --yes pa11y-ci@4.0.1 --config .pa11yci.json
