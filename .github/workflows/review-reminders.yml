name: Review reminders

on:
  schedule:
    - cron: "0 9 1 1,4,7,10 *"
    - cron: "0 9 1 2 *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  analytics-review:
    if: github.event.schedule != '0 9 1 2 *'
    runs-on: ubuntu-latest
    steps:
      - name: Open quarterly analytics issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Review analytics" \
            --body "Review the GoatCounter dashboard, profile metrics, and site content for the new quarter."

  job-search-review:
    if: github.event.schedule == '0 9 1 2 *'
    runs-on: ubuntu-latest
    steps:
      - name: Open 2027 job-search review issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%Y-%m-%d)" = "2027-02-01" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            gh issue create \
              --repo "${{ github.repository }}" \
              --title "Review the site before the 2027 job search" \
              --body "Review profile, publications, talks, research, teaching, and contact information before the 2027 job search."
          fi
